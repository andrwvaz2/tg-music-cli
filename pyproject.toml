[project]
name = "tg-music-cli"
version = "0.5.1"
description = "Terminal music player for Telegram channel audio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "dbus-next>=0.2.3; sys_platform != 'win32'",
  "mutagen>=1.48.1",
  "telethon>=1.36.0",
  "windows-curses>=2.3.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
lint = ["ruff>=0.4"]

[project.scripts]
tg-music = "tg_music.cli:main"
tgmusic-cli = "tg_music.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tg_music"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
